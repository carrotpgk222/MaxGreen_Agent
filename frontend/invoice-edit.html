<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>MaxGreen Agent — Construction Tax Invoice</title><link rel="icon" href="data:,"/><link rel="stylesheet" href="./assets/css/base.css"/><link rel="stylesheet" href="./assets/css/invoice-edit.css"/></head><body><main class="invoice-edit-page"><a id="back-to-invoice" class="back-link" href="./invoice.html">← Back to Invoice.pdf</a><section class="invoice-editor-card"><header class="invoice-editor-header"><h1>Construction Invoice.pdf</h1><button class="btn btn-primary" id="save-invoice" type="button">Save</button></header><form autocomplete="off"><section class="invoice-fields-grid top-row-fields"><div class="field company-combobox"><label for="inv-company">Company</label><input id="inv-company" type="text" autocomplete="off" aria-expanded="false"/><div class="company-suggestions" id="inv-company-suggestions" hidden></div></div><div class="field"><label for="inv-attn">Name (Attn)</label><select id="inv-attn"></select></div><div class="field"><label for="inv-date">Issue date</label><input id="inv-date" type="date"/></div><div class="field"><label for="inv-due-date">Due date</label><input id="inv-due-date" type="date"/></div><div class="field"><label for="inv-number">Invoice number</label><input id="inv-number" type="text" readonly/></div></section><section class="invoice-secondary-row"><div class="field"><label for="inv-currency">Currency</label><select id="inv-currency"><option value="SGD">SGD</option></select></div><div class="field"><label for="inv-ref-quote">Ref Quote</label><input id="inv-ref-quote" type="text" readonly/></div><div class="field"><label for="inv-external-do">External Ref. (DO)</label><input id="inv-external-do" type="text" readonly/></div></section><div class="field invoice-subject-field"><label for="inv-subject">Subject Title</label><input id="inv-subject" type="text"/></div><section class="invoice-items-section"><div class="table-wrap"><table class="invoice-items-table"><thead><tr><th>Item</th><th>Description</th><th>Qty</th><th>UOM</th><th>Unit Price</th><th>Tax Rate</th><th>Tax Amount</th><th>Amount SGD</th><th></th></tr></thead><tbody id="invoice-items"></tbody></table></div><div class="invoice-items-footer"><button class="btn btn-small" id="add-inv-row" type="button">Add Row</button></div></section><section class="invoice-attachment-row"><button class="btn" id="attach-inv-files" type="button">Attach files</button><button class="btn" id="replace-paynow-qr" type="button">Replace PayNow QR</button><span id="inv-attachment-note" class="subtle-note"></span><span id="qr-note" class="subtle-note">Default PayNow QR</span></section><section class="invoice-summary"><div class="amount-in-words"><strong id="inv-amount-words">Sum of Singapore Zero Dollars Only</strong><p>This is a computer generated document, no signature is required.</p></div><dl class="totals"><div><dt>Subtotal</dt><dd id="inv-subtotal">0.00</dd></div><div><dt id="inv-tax-label">GST (9%)</dt><dd id="inv-gst">0.00</dd></div><div class="grand-total"><dt>Total</dt><dd id="inv-total">0.00</dd></div></dl></section></form></section></main>
<div class="company-modal" id="inv-new-company-modal" hidden><div class="company-modal-backdrop" data-close-inv-company-modal></div><section class="company-modal-card"><header><h2>Update contact detail</h2><div><button class="btn" id="inv-cancel-new-company" type="button">Cancel</button><button class="btn" id="inv-save-new-company" type="button">Save</button></div></header><div class="field"><label>Company Name</label><input id="inv-new-company-name"/></div><div class="field"><label>Name (Attn)</label><input id="inv-new-company-attn"/></div><div class="field"><label>Email</label><input id="inv-new-company-email" type="email"/></div><div class="company-two"><div class="field"><label>Address</label><input id="inv-new-company-address"/></div><div class="field"><label>Postal</label><input id="inv-new-company-postal" inputmode="numeric"/></div></div><div class="field"><label>Contact Number</label><input id="inv-new-company-contact" inputmode="numeric"/></div></section></div>
<script type="module" src="./assets/js/pages/invoiceEdit.js"></script>
</body></html>

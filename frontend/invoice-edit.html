<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MaxGreen Agent — Construction Tax Invoice</title>

    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./assets/css/base.css" />

    <style>
        /* =========================================================
           BASE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #0f172a;

            background:
                radial-gradient(circle at 92% 5%,
                    rgba(124, 58, 237, 0.07),
                    transparent 30%),
                linear-gradient(235deg,
                    #eef2ff 0%,
                    #ffffff 50%,
                    #f5f3ff 100%);
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .invoice-edit-page {
            width: 100%;
            max-width: 1440px;
            min-height: 100vh;

            margin: 0 auto;
            padding: 40px 48px 70px;
        }


        /* =========================================================
           BACK LINK
        ========================================================= */

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 24px;

            color: #6366f1;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back-link:hover {
            color: #4338ca;
            transform: translateX(-3px);
        }


        /* =========================================================
           MAIN CARD
        ========================================================= */

        .invoice-editor-card {
            display: contents;
        }


        /* =========================================================
           PAGE HEADER
        ========================================================= */

        .invoice-editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            margin-bottom: 32px;
        }

        .invoice-editor-header h1 {
            position: relative;

            margin: 0;

            color: #0f172a;

            font-size: 36px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -1.1px;
        }

        .invoice-editor-header h1::after {
            content: "Edit and manage your invoice details";

            display: block;

            margin-top: 5px;

            color: #64748b;

            font-size: 14px;
            line-height: 1.4;
            font-weight: 400;
            letter-spacing: 0;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .btn {
            min-height: 44px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 0 22px;

            color: #64748b;
            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            font-size: 14px;
            font-weight: 600;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);

            border-color: #c7d2fe;

            box-shadow:
                0 6px 16px rgba(79, 70, 229, 0.10);
        }

        .btn-primary {
            color: #ffffff;

            background:
                linear-gradient(180deg,
                    #4f46e5 0%,
                    #7c3aed 100%);

            border: 0;

            box-shadow:
                0 4px 20px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            box-shadow:
                0 8px 24px rgba(79, 70, 229, 0.30);
        }

        #save-invoice {
            min-width: 120px;
            min-height: 44px;

            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        #save-invoice::before {
            content: "▣";
            font-size: 14px;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .invoice-editor-card form {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }


        /* =========================================================
           INVOICE DETAILS CARD
        ========================================================= */

        .top-row-fields {
            position: relative;

            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px;

            margin: 0;
            padding: 72px 36px 28px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-bottom: 0;
            border-radius: 20px 20px 0 0;

            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.05);
        }

        .top-row-fields::before {
            content: "INVOICE DETAILS";

            position: absolute;

            top: 35px;
            left: 36px;

            color: #64748b;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }


        /* Secondary fields visually join first card */

        .invoice-secondary-row {
            display: grid;
            grid-template-columns: 220px 1fr 1fr;
            gap: 16px;

            margin-top: -28px;
            padding: 0 36px 28px;

            background: #ffffff;

            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
        }


        /* Subject joins same card */

        .invoice-subject-field {
            margin-top: -28px;
            padding: 0 36px 36px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-top: 0;
            border-radius: 0 0 20px 20px;

            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.04);
        }


        /* =========================================================
           FIELD
        ========================================================= */

        .field {
            position: relative;

            min-width: 0;

            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            color: #0f172a;

            font-size: 13px;
            line-height: 1.2;
            font-weight: 600;
        }


        /* Helper text */

        .top-row-fields .field::after,
        .invoice-secondary-row .field::after,
        .invoice-subject-field::after {
            order: 1;

            color: #94a3b8;

            font-size: 11px;
            line-height: 1.2;
            font-weight: 400;
        }

        .top-row-fields .field input,
        .top-row-fields .field select,
        .invoice-secondary-row .field input,
        .invoice-secondary-row .field select,
        .invoice-subject-field input {
            order: 2;
        }

        .company-combobox::after {
            content: "Registered company name";
        }

        .top-row-fields .field:nth-child(2)::after {
            content: "Contact person at company";
        }

        .top-row-fields .field:nth-child(3)::after {
            content: "Date invoice is issued";
        }

        .top-row-fields .field:nth-child(4)::after {
            content: "Payment deadline";
        }

        .top-row-fields .field:nth-child(5)::after {
            content: "Auto-generated identifier";
        }

        .invoice-secondary-row .field:nth-child(1)::after {
            content: "Default billing currency";
        }

        .invoice-secondary-row .field:nth-child(2)::after {
            content: "Completed quotation reference";
        }

        .invoice-secondary-row .field:nth-child(3)::after {
            content: "Linked delivery order reference";
        }

        .invoice-subject-field::after {
            content: "Displayed as invoice subject line";
        }


        /* =========================================================
           INPUTS
        ========================================================= */

        .field input,
        .field select {
            width: 100%;
            height: 44px;

            padding: 0 15px;

            color: #0f172a;
            background: #f8fafc;

            border: 1px solid #e2e8f0;
            border-radius: 10px;

            outline: none;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .field select {
            cursor: pointer;
        }

        .field input:hover,
        .field select:hover {
            border-color: #c7d2fe;
        }

        .field input:focus,
        .field select:focus {
            background: #ffffff;
            border-color: #818cf8;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.09);
        }

        .field input[readonly] {
            color: #64748b;
            background: #f8fafc;

            cursor: default;
        }

        #inv-attn,
        #inv-subject {
            border-color: #c7d2fe;
        }

        #inv-attn {
            color: #4f46e5;
        }


        /* =========================================================
           COMPANY SUGGESTIONS
        ========================================================= */

        .company-combobox {
            z-index: 10;
        }

        .company-suggestions {
            position: absolute;
            z-index: 100;

            top: calc(100% + 5px);
            left: 0;
            right: 0;

            max-height: 240px;

            padding: 6px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 10px;

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.13);

            overflow-y: auto;
        }

        .company-suggestions[hidden] {
            display: none;
        }

        .company-suggestions>* {
            padding: 10px 12px;

            border-radius: 7px;

            color: #475569;

            font-size: 13px;

            cursor: pointer;
        }

        .company-suggestions>*:hover {
            color: #4338ca;
            background: #eef2ff;
        }


        /* =========================================================
           REF QUOTE SUGGESTIONS
        ========================================================= */

        .invoice-secondary-row .ref-quote-combobox {
            order: 2;
        }

        .ref-quote-picker-field,
        .ref-quote-combobox {
            position: relative;
        }

        .ref-quote-suggestions {
            position: absolute;
            z-index: 100;

            top: calc(100% + 5px);
            left: 0;
            right: 0;

            max-height: 240px;

            padding: 6px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 10px;

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.13);

            overflow-y: auto;
        }

        .ref-quote-suggestions[hidden] {
            display: none;
        }

        .ref-quote-suggestion {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            width: 100%;

            padding: 10px 12px;

            color: #475569;

            font-size: 13px;

            text-align: left;

            background: transparent;
            border: 0;
            border-radius: 7px;

            cursor: pointer;
        }

        .ref-quote-suggestion:hover,
        .ref-quote-suggestion:focus {
            color: #4338ca;
            background: #eef2ff;
            outline: none;
        }

        .ref-quote-suggestion span {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .ref-quote-suggestion small {
            color: #94a3b8;
            font-size: 11px;
        }

        .ref-quote-empty {
            padding: 10px 12px;

            color: #94a3b8;
            font-size: 13px;
        }


        /* =========================================================
           LINE ITEMS CARD
        ========================================================= */

        .invoice-items-section {
            position: relative;

            padding: 66px 36px 20px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 20px;

            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.05);
        }

        .invoice-items-section::before {
            content: "LINE ITEMS";

            position: absolute;

            top: 35px;
            left: 36px;

            color: #64748b;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .table-wrap {
            width: 100%;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            overflow-x: auto;
            overflow-y: visible;
        }

        .invoice-items-table {
            width: 100%;
            min-width: 1100px;

            border-collapse: collapse;

            background: #ffffff;
        }

        .invoice-items-table thead {
            background: #f1f5f9;
        }

        .invoice-items-table th {
            padding: 14px 10px;

            color: #64748b;

            border-bottom: 1px solid #e2e8f0;

            font-size: 12px;
            font-weight: 700;

            text-align: left;
            white-space: nowrap;
        }

        .invoice-items-table th:nth-child(1) {
            width: 130px;
        }

        .invoice-items-table th:nth-child(2) {
            min-width: 280px;
        }

        .invoice-items-table th:nth-child(3),
        .invoice-items-table th:nth-child(4) {
            width: 72px;
            text-align: center;
        }

        .invoice-items-table th:nth-child(5) {
            width: 110px;
            text-align: center;
        }

        .invoice-items-table th:nth-child(6) {
            width: 90px;
            text-align: center;
        }

        .invoice-items-table th:nth-child(7) {
            width: 110px;
            text-align: center;
        }

        .invoice-items-table th:nth-child(8) {
            width: 120px;
            text-align: center;
        }

        .invoice-items-table th:nth-child(9) {
            width: 46px;
        }


        /* Generated rows */

        .invoice-items-table td {
            padding: 12px 8px;

            color: #475569;

            border-bottom: 1px solid #e2e8f0;

            font-size: 13px;
            vertical-align: middle;
        }

        .invoice-items-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .invoice-items-table tbody tr {
            transition: background 0.15s ease;
        }

        .invoice-items-table tbody tr:hover {
            background: #fafaff;
        }

        .invoice-items-table td input,
        .invoice-items-table td select,
        .invoice-items-table td textarea {
            width: 100%;
            min-height: 38px;

            padding: 8px 9px;

            color: #334155;
            background: #f8fafc;

            border: 1px solid transparent;
            border-radius: 7px;

            outline: none;

            font-size: 13px;
        }

        .invoice-items-table td textarea {
            resize: vertical;
        }

        .invoice-items-table td input:hover,
        .invoice-items-table td select:hover,
        .invoice-items-table td textarea:hover {
            border-color: #e2e8f0;
        }

        .invoice-items-table td input:focus,
        .invoice-items-table td select:focus,
        .invoice-items-table td textarea:focus {
            background: #ffffff;
            border-color: #818cf8;

            box-shadow:
                0 0 0 2px rgba(99, 102, 241, 0.08);
        }


        /* Delete button generated by JS */

        .invoice-items-table td:last-child button {
            width: 32px;
            height: 32px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            color: #94a3b8;
            background: transparent;

            border: 1px solid transparent;
            border-radius: 7px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .invoice-items-table td:last-child button:hover {
            color: #ef4444;
            background: #fef2f2;

            border-color: #fecaca;
        }


        /* =========================================================
           ADD ROW
        ========================================================= */

        .invoice-items-footer {
            display: flex;
            justify-content: flex-end;

            padding-top: 14px;
        }

        #add-inv-row {
            min-height: 36px;

            padding: 0 18px;

            color: #ffffff;

            background:
                linear-gradient(180deg,
                    #4f46e5 0%,
                    #7c3aed 100%);

            border: 0;
            border-radius: 8px;

            box-shadow:
                0 2px 10px rgba(79, 70, 229, 0.19);

            font-size: 13px;
        }

        #add-inv-row::before {
            content: "+";

            font-size: 17px;
            line-height: 1;
        }


        /* =========================================================
           ATTACHMENTS
        ========================================================= */

        .invoice-attachment-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        #attach-inv-files::before {
            content: "↗";
            font-size: 15px;
        }

        #replace-paynow-qr::before {
            content: "▦";
            font-size: 16px;
        }

        .subtle-note {
            color: #94a3b8;

            font-size: 12px;
        }

        #qr-note {
            padding: 6px 10px;

            color: #6366f1;
            background: #eef2ff;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 600;
        }


        /* =========================================================
           SUMMARY CARD
        ========================================================= */

        .invoice-summary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 48px;

            padding: 36px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 20px;

            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.05);
        }


        /* =========================================================
           AMOUNT IN WORDS
        ========================================================= */

        .amount-in-words {
            min-width: 0;
        }

        .amount-in-words::before {
            content: "AMOUNT IN WORDS";

            display: block;

            margin-bottom: 16px;

            color: #64748b;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        #inv-amount-words {
            display: block;

            max-width: 720px;

            color: #0f172a;

            font-size: 28px;
            line-height: 1.3;
            font-weight: 700;

            letter-spacing: -0.4px;
        }

        .amount-in-words p {
            display: flex;
            align-items: center;
            gap: 8px;

            margin: 17px 0 0;

            color: #94a3b8;

            font-size: 13px;
        }

        .amount-in-words p::before {
            content: "ⓘ";

            color: #cbd5e1;

            font-size: 14px;
        }


        /* =========================================================
           TOTALS
        ========================================================= */

        .totals {
            width: 100%;

            margin: 0;
        }

        .totals>div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 14px 0;

            border-bottom: 1px solid #e2e8f0;
        }

        .totals dt,
        .totals dd {
            margin: 0;
        }

        .totals dt {
            color: #64748b;

            font-size: 14px;
            font-weight: 500;
        }

        .totals dd {
            color: #0f172a;

            font-size: 14px;
            font-weight: 600;
        }

        .totals dd::before {
            content: "SGD ";
        }

        .totals .grand-total {
            padding: 16px 0;

            border-top: 1px solid #4f46e5;
            border-bottom: 0;
        }

        .totals .grand-total dt {
            color: #0f172a;

            font-size: 22px;
            font-weight: 800;
        }

        .totals .grand-total dd {
            color: #4f46e5;

            font-size: 22px;
            font-weight: 800;
        }


        /* =========================================================
           COMPANY MODAL
        ========================================================= */

        .company-modal {
            position: fixed;
            z-index: 2000;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .company-modal[hidden] {
            display: none;
        }

        .company-modal-backdrop {
            position: absolute;

            inset: 0;

            background: rgba(15, 23, 42, 0.45);

            backdrop-filter: blur(5px);
        }

        .company-modal-card {
            position: relative;
            z-index: 1;

            width: min(620px, 100%);

            display: flex;
            flex-direction: column;
            gap: 18px;

            padding: 28px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 20px;

            box-shadow:
                0 30px 80px rgba(15, 23, 42, 0.20);
        }

        .company-modal-card header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding-bottom: 18px;

            border-bottom: 1px solid #e2e8f0;
        }

        .company-modal-card h2 {
            margin: 0;

            color: #0f172a;

            font-size: 21px;
            font-weight: 750;
        }

        .company-modal-card header>div {
            display: flex;
            gap: 8px;
        }

        #inv-save-new-company {
            color: #ffffff;

            background:
                linear-gradient(180deg,
                    #4f46e5,
                    #7c3aed);

            border: 0;
        }

        .company-two {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 14px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1180px) {

            .top-row-fields {
                grid-template-columns: repeat(3, 1fr);
            }

            .invoice-secondary-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }


        @media (max-width: 850px) {

            .invoice-edit-page {
                padding: 30px 24px 50px;
            }

            .invoice-editor-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .invoice-editor-header h1 {
                font-size: 30px;
            }

            #save-invoice {
                width: 100%;
            }

            .top-row-fields {
                grid-template-columns: repeat(2, 1fr);

                padding-left: 24px;
                padding-right: 24px;
            }

            .top-row-fields::before {
                left: 24px;
            }

            .invoice-secondary-row {
                grid-template-columns: 1fr;

                padding-left: 24px;
                padding-right: 24px;
            }

            .invoice-subject-field {
                padding-left: 24px;
                padding-right: 24px;
            }

            .invoice-items-section {
                padding-left: 24px;
                padding-right: 24px;
            }

            .invoice-items-section::before {
                left: 24px;
            }

            .invoice-summary {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 580px) {

            .invoice-edit-page {
                padding: 22px 16px 40px;
            }

            .invoice-editor-header h1 {
                font-size: 26px;
            }

            .top-row-fields {
                grid-template-columns: 1fr;
            }

            .invoice-attachment-row {
                align-items: stretch;
                flex-direction: column;
            }

            .invoice-attachment-row .btn {
                width: 100%;
            }

            .invoice-summary {
                padding: 26px 22px;
            }

            #inv-amount-words {
                font-size: 22px;
            }

            .company-two {
                grid-template-columns: 1fr;
            }

            .company-modal-card header {
                align-items: flex-start;
                flex-direction: column;
            }

            .company-modal-card header>div {
                width: 100%;
            }

            .company-modal-card header .btn {
                flex: 1;
            }
        }
    </style>
</head>


<body>

    <main class="invoice-edit-page">

        <a id="back-to-invoice" class="back-link" href="./invoice.html">
            ← Back to Invoice.pdf
        </a>


        <section class="invoice-editor-card">


            <!-- =====================================================
                 HEADER
            ====================================================== -->

            <header class="invoice-editor-header">

                <h1>
                    Construction Invoice.pdf
                </h1>

                <button class="btn btn-primary" id="save-invoice" type="button">
                    Save
                </button>

            </header>


            <form autocomplete="off">


                <!-- =================================================
                     INVOICE DETAILS
                ================================================== -->

                <section class="invoice-fields-grid top-row-fields">


                    <div class="field company-combobox">

                        <label for="inv-company">
                            Company
                        </label>

                        <input id="inv-company" type="text" autocomplete="off" aria-expanded="false" />

                        <div class="company-suggestions" id="inv-company-suggestions" hidden></div>

                    </div>


                    <div class="field">

                        <label for="inv-attn">
                            Name (Attn)
                        </label>

                        <select id="inv-attn"></select>

                    </div>


                    <div class="field">

                        <label for="inv-date">
                            Issue date
                        </label>

                        <input id="inv-date" type="date" />

                    </div>


                    <div class="field">

                        <label for="inv-due-date">
                            Due date
                        </label>

                        <input id="inv-due-date" type="date" />

                    </div>


                    <div class="field">

                        <label for="inv-number">
                            Invoice number
                        </label>

                        <input id="inv-number" type="text" readonly />

                    </div>

                </section>


                <!-- =================================================
                     SECONDARY DETAILS
                ================================================== -->

                <section class="invoice-secondary-row">


                    <div class="field">

                        <label for="inv-currency">
                            Currency
                        </label>

                        <select id="inv-currency">
                            <option value="SGD">SGD</option>
                        </select>

                    </div>


                    <div class="field ref-quote-picker-field">

                        <label for="inv-ref-quote">
                            Ref Quote
                        </label>

                        <div class="ref-quote-combobox">

                            <input id="inv-ref-quote" type="text" autocomplete="off" role="combobox"
                                aria-autocomplete="list" aria-expanded="false"
                                aria-controls="inv-ref-quote-suggestions"
                                placeholder="Search completed quotation" />

                            <div class="ref-quote-suggestions" id="inv-ref-quote-suggestions" role="listbox" hidden></div>

                        </div>

                    </div>


                    <div class="field">

                        <label for="inv-external-do">
                            External Ref. (DO)
                        </label>

                        <input id="inv-external-do" type="text" readonly />

                    </div>

                </section>


                <!-- =================================================
                     SUBJECT
                ================================================== -->

                <div class="field invoice-subject-field">

                    <label for="inv-subject">
                        Subject Title
                    </label>

                    <input id="inv-subject" type="text" />

                </div>


                <!-- =================================================
                     LINE ITEMS
                ================================================== -->

                <section class="invoice-items-section">

                    <div class="table-wrap">

                        <table class="invoice-items-table">

                            <thead>

                                <tr>
                                    <th>Item</th>
                                    <th>Description</th>
                                    <th>Qty</th>
                                    <th>UOM</th>
                                    <th>Unit Price</th>
                                    <th>Tax Rate</th>
                                    <th>Tax Amount</th>
                                    <th>Amount SGD</th>
                                    <th></th>
                                </tr>

                            </thead>

                            <tbody id="invoice-items"></tbody>

                        </table>

                    </div>


                    <div class="invoice-items-footer">

                        <button class="btn btn-small" id="add-inv-row" type="button">
                            Add Row
                        </button>

                    </div>

                </section>


                <!-- =================================================
                     ATTACHMENTS
                ================================================== -->

                <section class="invoice-attachment-row">

                    <button class="btn" id="attach-inv-files" type="button">
                        Attach files
                    </button>


                    <button class="btn" id="replace-paynow-qr" type="button">
                        Replace PayNow QR
                    </button>


                    <span id="inv-attachment-note" class="subtle-note"></span>


                    <span id="qr-note" class="subtle-note">
                        Default PayNow QR
                    </span>

                </section>


                <!-- =================================================
                     TOTALS
                ================================================== -->

                <section class="invoice-summary">


                    <div class="amount-in-words">

                        <strong id="inv-amount-words">
                            Sum of Singapore Zero Dollars Only
                        </strong>

                        <p>
                            This is a computer generated document,
                            no signature is required.
                        </p>

                    </div>


                    <dl class="totals">


                        <div>

                            <dt>
                                Subtotal
                            </dt>

                            <dd id="inv-subtotal">
                                0.00
                            </dd>

                        </div>


                        <div>

                            <dt id="inv-tax-label">
                                GST (9%)
                            </dt>

                            <dd id="inv-gst">
                                0.00
                            </dd>

                        </div>


                        <div class="grand-total">

                            <dt>
                                Total
                            </dt>

                            <dd id="inv-total">
                                0.00
                            </dd>

                        </div>


                    </dl>

                </section>

            </form>

        </section>

    </main>


    <!-- =========================================================
         COMPANY MODAL
    ========================================================== -->

    <div class="company-modal" id="inv-new-company-modal" hidden>

        <div class="company-modal-backdrop" data-close-inv-company-modal></div>


        <section class="company-modal-card">


            <header>

                <h2>
                    Update contact detail
                </h2>


                <div>

                    <button class="btn" id="inv-cancel-new-company" type="button">
                        Cancel
                    </button>


                    <button class="btn" id="inv-save-new-company" type="button">
                        Save
                    </button>

                </div>

            </header>


            <div class="field">

                <label>
                    Company Name
                </label>

                <input id="inv-new-company-name" />

            </div>


            <div class="field">

                <label>
                    Name (Attn)
                </label>

                <input id="inv-new-company-attn" />

            </div>


            <div class="field">

                <label>
                    Email
                </label>

                <input id="inv-new-company-email" type="email" />

            </div>


            <div class="company-two">


                <div class="field">

                    <label>
                        Address
                    </label>

                    <input id="inv-new-company-address" />

                </div>


                <div class="field">

                    <label>
                        Postal
                    </label>

                    <input id="inv-new-company-postal" inputmode="numeric" />

                </div>


            </div>


            <div class="field">

                <label>
                    Contact Number
                </label>

                <input id="inv-new-company-contact" inputmode="numeric" />

            </div>


        </section>

    </div>


    <!-- =========================================================
         EXISTING JAVASCRIPT
    ========================================================== -->

    <script type="module" src="./assets/js/pages/invoiceEdit.js"></script>

</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MaxGreen Agent — Dashboard</title>

  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./assets/css/base.css" />

  <style>
    /* =========================================================
           DASHBOARD
        ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body.dashboard-page {
      min-height: 100vh;
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #0f172a;

      background:
        radial-gradient(circle at 90% 5%,
          rgba(99, 102, 241, 0.10),
          transparent 30%),
        radial-gradient(circle at 5% 95%,
          rgba(59, 130, 246, 0.08),
          transparent 35%),
        linear-gradient(235deg,
          #e8eeff 0%,
          #f0eeff 48%,
          #fafafa 100%);
    }

    a {
      color: inherit;
    }


    /* =========================================================
           PAGE
        ========================================================= */

    .page {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 48px 48px;
    }


    /* =========================================================
           HEADER
        ========================================================= */

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 30px;
      margin-bottom: 32px;
    }

    .dashboard-heading h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #0f172a;
    }

    .dashboard-heading p {
      margin: 7px 0 0;
      font-size: 14px;
      color: #64748b;
    }


    /* =========================================================
           HEADER ACTIONS
        ========================================================= */

    .dashboard-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-wrapper {
      width: 280px;
      height: 46px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 17px;

      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      border-radius: 999px;

      box-shadow:
        0 2px 12px rgba(15, 23, 42, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .search-wrapper:focus-within {
      border-color: #a5b4fc;
      box-shadow:
        0 0 0 4px rgba(99, 102, 241, 0.08),
        0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .search-icon {
      flex-shrink: 0;
      color: #94a3b8;
    }

    .dashboard-search {
      width: 100%;
      min-width: 0;
      padding: 0;

      border: 0;
      outline: none;
      background: transparent;

      color: #0f172a;
      font: inherit;
      font-size: 14px;
    }

    .dashboard-search::placeholder {
      color: #94a3b8;
    }

    .settings-link {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      color: #64748b;
      text-decoration: none;

      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      border-radius: 50%;

      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03);

      transition:
        transform 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .settings-link:hover {
      transform: translateY(-2px) rotate(10deg);
      color: #6366f1;
      border-color: #c7d2fe;

      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.12);
    }


    /* =========================================================
           MAIN GRID
        ========================================================= */

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(560px, 1.05fr) minmax(420px, 0.95fr);
      gap: 24px;
      align-items: stretch;
    }


    /* =========================================================
           LEFT
        ========================================================= */

    .dashboard-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dashboard-top-cards,
    .dashboard-middle-cards {
      display: grid;
      gap: 16px;
    }

    .dashboard-top-cards {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .dashboard-middle-cards {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }


    /* =========================================================
           STAT CARDS
        ========================================================= */

    .dashboard-stat {
      position: relative;
      min-height: 220px;

      display: flex;
      flex-direction: column;

      padding: 25px 22px;

      text-decoration: none;
      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .dashboard-stat::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      right: -55px;
      bottom: -65px;

      border-radius: 50%;
      background: currentColor;
      opacity: 0.035;

      pointer-events: none;
    }

    .dashboard-stat:hover {
      transform: translateY(-5px);
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .stat-icon {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border-radius: 50%;
    }

    .stat-arrow {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid currentColor;

      font-size: 22px;
      font-weight: 400;
      line-height: 1;

      opacity: 0.65;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .dashboard-stat:hover .stat-arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    .dashboard-stat-number {
      margin-top: auto;
      margin-bottom: 5px;

      color: #0f172a;

      font-size: clamp(38px, 4vw, 48px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .dashboard-stat-title {
      color: #0f172a;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
    }

    .dashboard-stat-subtitle {
      margin-top: 4px;

      color: #94a3b8;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 400;
    }


    /* =========================================================
           INBOX — PURPLE
        ========================================================= */

    .stat-inbox {
      color: #7c3aed;

      background:
        linear-gradient(145deg,
          #f5f3ff 0%,
          #faf8ff 100%);

      box-shadow: 0 5px 25px rgba(124, 58, 237, 0.08);
    }

    .stat-inbox .stat-icon {
      color: #7c3aed;
      background: #ede9fe;
    }

    .stat-inbox .stat-arrow {
      border-color: #e9d5ff;
    }

    .stat-inbox:hover {
      border-color: #ddd6fe;
      box-shadow: 0 15px 35px rgba(124, 58, 237, 0.14);
    }


    /* =========================================================
           RECEIVABLE — BLUE
        ========================================================= */

    .stat-receivable {
      color: #3b82f6;

      background:
        linear-gradient(145deg,
          #eff6ff 0%,
          #f8fbff 100%);

      box-shadow: 0 5px 25px rgba(59, 130, 246, 0.08);
    }

    .stat-receivable .stat-icon {
      color: #3b82f6;
      background: #dbeafe;
    }

    .stat-receivable .stat-arrow {
      border-color: #bfdbfe;
    }

    .stat-receivable:hover {
      border-color: #bfdbfe;
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.14);
    }


    /* =========================================================
           PAYABLE — ORANGE
        ========================================================= */

    .stat-payable {
      color: #ea580c;

      background:
        linear-gradient(145deg,
          #fff7ed 0%,
          #fffaf5 100%);

      box-shadow: 0 5px 25px rgba(234, 88, 12, 0.08);
    }

    .stat-payable .stat-icon {
      color: #ea580c;
      background: #fed7aa;
    }

    .stat-payable .stat-arrow {
      border-color: #fed7aa;
    }

    .stat-payable:hover {
      border-color: #fed7aa;
      box-shadow: 0 15px 35px rgba(234, 88, 12, 0.14);
    }


    /* =========================================================
           PENDING — GREEN
        ========================================================= */

    .stat-pending {
      color: #16a34a;

      background:
        linear-gradient(145deg,
          #f0fdf4 0%,
          #f8fff9 100%);

      box-shadow: 0 5px 25px rgba(22, 163, 74, 0.08);
    }

    .stat-pending .stat-icon {
      color: #16a34a;
      background: #bbf7d0;
    }

    .stat-pending .stat-arrow {
      border-color: #86efac;
    }

    .stat-pending:hover {
      border-color: #bbf7d0;
      box-shadow: 0 15px 35px rgba(22, 163, 74, 0.14);
    }


    /* =========================================================
           COMPLETED — PURPLE
        ========================================================= */

    .stat-completed {
      color: #9333ea;

      background:
        linear-gradient(145deg,
          #faf5ff 0%,
          #fdfaff 100%);

      box-shadow: 0 5px 25px rgba(147, 51, 234, 0.08);
    }

    .stat-completed .stat-icon {
      color: #9333ea;
      background: #e9d5ff;
    }

    .stat-completed .stat-arrow {
      border-color: #d8b4fe;
    }

    .stat-completed:hover {
      border-color: #e9d5ff;
      box-shadow: 0 15px 35px rgba(147, 51, 234, 0.14);
    }


    /* =========================================================
           ALL CUSTOMERS
        ========================================================= */

    .all-customers-card {
      position: relative;

      min-height: 82px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 18px 28px;

      color: #ffffff;
      text-decoration: none;

      border-radius: 22px;

      background:
        radial-gradient(circle at 90% 20%,
          rgba(255, 255, 255, 0.20),
          transparent 25%),
        linear-gradient(110deg,
          #3b82f6 0%,
          #6366f1 48%,
          #7c3aed 100%);

      box-shadow:
        0 12px 32px rgba(59, 130, 246, 0.19),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);

      overflow: hidden;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .all-customers-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 18px 40px rgba(79, 70, 229, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .all-customers-left {
      display: flex;
      align-items: center;
      gap: 16px;

      font-size: 20px;
      font-weight: 700;
    }

    .all-customers-icon {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.08);

      border-radius: 50%;
    }

    .all-customers-arrow {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      background: rgba(255, 255, 255, 0.14);
      border-radius: 50%;

      font-size: 27px;
      line-height: 1;

      transition: transform 0.2s ease;
    }

    .all-customers-card:hover .all-customers-arrow {
      transform: translateX(4px);
    }


    /* =========================================================
           RECEIVABLE PANEL
        ========================================================= */

    .receivable-card {
      min-width: 0;

      display: flex;
      flex-direction: column;

      padding: 28px;

      background: rgba(255, 255, 255, 0.93);
      border: 1px solid #e2e8f0;
      border-radius: 22px;

      box-shadow:
        0 8px 30px rgba(15, 23, 42, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      backdrop-filter: blur(8px);
    }

    .receivable-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .receivable-header h2 {
      margin: 0;

      color: #0f172a;

      font-size: 22px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .receivable-header p {
      margin: 5px 0 0;

      color: #64748b;

      font-size: 13px;
      line-height: 1.4;
    }

    .receivable-menu {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      padding: 0;

      color: #94a3b8;
      background: #f8fafc;

      border: 1px solid #e2e8f0;
      border-radius: 50%;

      font-size: 13px;
      letter-spacing: 1px;

      cursor: pointer;

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .receivable-menu:hover {
      color: #6366f1;
      background: #eef2ff;
      border-color: #c7d2fe;
    }


    /* =========================================================
           MONEY SUMMARY
        ========================================================= */

    .money-summary {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;

      margin: 25px 0;
    }

    .money-block {
      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .money-block:nth-of-type(3) {
      padding-left: 24px;
    }

    .money-block strong {
      display: block;

      font-size: clamp(27px, 3vw, 34px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .money-block span {
      color: #64748b;

      font-size: 13px;
      line-height: 1.4;
    }

    #receivable-total {
      color: #3b82f6;
    }

    #receivable-overdue {
      color: #7c3aed;
    }

    .money-summary .divider {
      width: 1px;
      height: 54px;

      background: #e2e8f0;
    }


    /* =========================================================
           CHART
        ========================================================= */

    .chart-area {
      flex: 1;

      min-height: 420px;

      display: flex;

      padding: 24px 22px 18px;

      background:
        linear-gradient(180deg,
          #f8fafc 0%,
          #fbfcfe 100%);

      border: 1px solid #e2e8f0;
      border-radius: 15px;

      overflow: hidden;
    }

    .chart-container {
      width: 100%;
      min-height: 360px;

      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
    }


    /* Y AXIS */

    .chart-y-axis {
      height: calc(100% - 42px);

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 3px 0 0;

      color: #94a3b8;

      font-size: 12px;
      font-weight: 500;
    }


    /* CHART */
    #receivable-chart-bars {
      position: relative;
      z-index: 1;

      grid-column: 1 / -1;

      width: 100%;
      height: 100%;

      display: grid;
      grid-template-columns: repeat(4, minmax(65px, 1fr));
      align-items: end;
      gap: clamp(16px, 3vw, 34px);
    }

    .chart {
      position: relative;
      height: 100%;
      padding: 0 12px;
    }

    .chart-grid-lines {
      position: absolute;

      top: 0;
      right: 0;
      bottom: 42px;
      left: 0;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      pointer-events: none;
    }

    .chart-grid-lines span {
      display: block;
      width: 100%;
      height: 1px;

      background: #e9eef5;
    }

    .chart-item {
      position: relative;
      z-index: 1;

      height: 100%;

      display: grid;
      grid-template-rows: minmax(0, 1fr) 42px;
      align-items: end;
      justify-items: center;

      min-width: 0;
    }

    .chart-bar-wrap {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .chart-bar {
      position: relative;

      width: min(66px, 70%);

      min-height: 10px;

      border-radius: 9px 9px 3px 3px;

      background:
        linear-gradient(180deg,
          #6366f1 0%,
          #818cf8 45%,
          #a5b4fc 100%);

      box-shadow:
        0 8px 18px rgba(99, 102, 241, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .chart-bar::before {
      content: "";

      position: absolute;

      top: 0;
      right: 0;
      left: 0;

      height: 28%;

      border-radius: inherit;

      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.18),
          transparent);
    }

    .chart-item:hover .chart-bar {
      transform: translateY(-3px);
      filter: saturate(1.1);
    }

    .chart-item>span {
      align-self: center;

      max-width: 100%;

      color: #94a3b8;

      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    /* =========================================================
   RECEIVABLE CHART TOOLTIP
   ========================================================= */

    .chart-tooltip {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 10px);

      transform: translateX(-50%) translateY(5px);

      padding: 7px 10px;

      color: #ffffff;
      background: #0f172a;

      border-radius: 7px;

      font-size: 12px;
      font-weight: 600;
      line-height: 1;

      white-space: nowrap;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);

      transition:
        opacity 0.15s ease,
        transform 0.15s ease,
        visibility 0.15s ease;
    }


    /* Little triangle */

    .chart-tooltip::after {
      content: "";

      position: absolute;

      top: 100%;
      left: 50%;

      transform: translateX(-50%);

      border: 5px solid transparent;
      border-top-color: #0f172a;
    }


    /* Show when hovering */

    .chart-bar:hover .chart-tooltip {
      opacity: 1;
      visibility: visible;

      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================
           RESPONSIVE
        ========================================================= */

    @media (max-width: 1100px) {

      .page {
        padding: 32px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .receivable-card {
        min-height: 600px;
      }
    }


    @media (max-width: 760px) {

      .page {
        padding: 24px 18px 32px;
      }

      .dashboard-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }

      .dashboard-heading h1 {
        font-size: 34px;
      }

      .dashboard-top-cards {
        grid-template-columns: 1fr 1fr;
      }

      .dashboard-middle-cards {
        grid-template-columns: 1fr 1fr;
      }

      .dashboard-stat {
        min-height: 200px;
      }

      .chart-area {
        overflow-x: auto;
      }

      .chart-container {
        min-width: 560px;
      }
    }


    @media (max-width: 520px) {

      .dashboard-top-cards,
      .dashboard-middle-cards {
        grid-template-columns: 1fr;
      }

      .dashboard-stat {
        min-height: 180px;
      }

      .all-customers-card {
        padding: 16px 20px;
      }

      .all-customers-left {
        font-size: 17px;
      }

      .receivable-card {
        padding: 21px;
      }

      .money-summary {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .money-summary .divider {
        width: 100%;
        height: 1px;
      }

      .money-block:nth-of-type(3) {
        padding-left: 0;
      }
    }
  </style>
</head>


<body class="dashboard-page">

  <main class="page">

    <!-- ===================== HEADER ===================== -->

    <header class="dashboard-header">

      <div class="dashboard-heading">
        <h1>Dashboard</h1>
        <p>Here's what's happening with your business today.</p>
      </div>


    </header>


    <!-- ===================== GRID ===================== -->

    <div class="dashboard-grid">


      <!-- ================= LEFT ================= -->

      <section class="dashboard-left" aria-label="Dashboard shortcuts">

        <!-- TOP CARDS -->

        <div class="dashboard-top-cards">


          <!-- INBOX -->

          <a class="dashboard-stat stat-inbox" href="./inbox.html" id="inbox-link">

            <div class="stat-header">

              <div class="stat-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16v16H4z"></path>
                  <path d="M4 13h4l2 3h4l2-3h4"></path>
                </svg>
              </div>

              <span class="stat-arrow">›</span>

            </div>

            <div class="dashboard-stat-number" id="count-inbox">0</div>

            <div class="dashboard-stat-title">
              Inbox
            </div>

            <div class="dashboard-stat-subtitle">
              To be Reviewed
            </div>

          </a>


          <!-- CUSTOMER RECEIVABLE -->

          <a class="dashboard-stat stat-receivable" href="./customer-receivable.html">

            <div class="stat-header">

              <div class="stat-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path>
                </svg>
              </div>

              <span class="stat-arrow">›</span>

            </div>

            <div class="dashboard-stat-number" id="count-receivable">0</div>

            <div class="dashboard-stat-title">
              Customer
            </div>

            <div class="dashboard-stat-subtitle">
              Receivable
            </div>

          </a>


          <!-- SUPPLIER -->

          <a class="dashboard-stat stat-payable" href="./supplier-payable.html">

            <div class="stat-header">

              <div class="stat-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="6" rx="1"></rect>
                  <rect x="3" y="9" width="18" height="6" rx="1"></rect>
                  <rect x="3" y="15" width="18" height="6" rx="1"></rect>
                </svg>
              </div>

              <span class="stat-arrow">›</span>

            </div>

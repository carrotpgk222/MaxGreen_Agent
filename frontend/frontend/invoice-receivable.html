<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MaxGreen Agent — Invoice Receivable</title>

    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./assets/css/base.css" />

    <link rel="stylesheet" href="./assets/css/invoice-receivable.css" />
</head>


<body>

    <main class="invoice-receivable-page">

        <!-- =====================================================
             BACK
        ====================================================== -->

        <a class="back-link" href="./customer-receivable.html">
            ← Back to Customer Receivable
        </a>


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header>

            <div>

                <h1>
                    Invoice Receivable
                </h1>

                <!-- Existing JS updates this -->
                <h2 id="receivable-invoice-no">
                    —
                </h2>

                <!-- Existing JS updates this -->
                <p id="receivable-company"></p>

            </div>


            <!-- Existing JS button ID preserved -->

            <button class="btn" id="add-payment-row" type="button">
                Add Row
            </button>

        </header>


        <!-- =====================================================
             PAYMENT TABLE
        ====================================================== -->

        <section class="payment-table-wrap">

            <table class="payment-table">

                <thead>

                    <tr>
                        <th>No</th>
                        <th>Amount</th>
                        <th>Paid Amount</th>
                        <th>Date</th>
                        <th>Balance</th>
                        <th></th>
                    </tr>

                </thead>


                <!--
                    IMPORTANT:
                    Your existing invoiceReceivable.js continues
                    creating/populating the rows here.
                -->

                <tbody id="payment-body"></tbody>

            </table>

        </section>


        <!-- =====================================================
             SAVE
        ====================================================== -->

        <button class="btn btn-primary save-receivable" id="save-receivable" type="button">
            Save
        </button>

    </main>


    <!-- =========================================================
         EXISTING JAVASCRIPT
    ========================================================== -->

    <script type="module" src="./assets/js/pages/invoiceReceivable.js"></script>

</body>

</html>

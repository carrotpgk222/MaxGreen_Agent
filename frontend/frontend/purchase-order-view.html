<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase Order.pdf</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/purchase-order-view.css" />
</head>
<body>
  <main class="po-page">
    <a class="back-link" href="javascript:window.close()">← Close attachment</a>
    <article class="po-paper">
      <header class="po-header">
        <div><h1>PURCHASE ORDER</h1><div id="po-company">Customer</div></div>
        <div><span class="po-label">PO No.</span><div id="po-number">—</div></div>
      </header>
      <section class="po-meta">
        <div><span class="po-label">Subject</span><div id="po-subject">—</div></div>
        <div><span class="po-label">Date</span><div id="po-date">—</div></div>
      </section>
      <table class="po-table">
        <thead><tr><th>Item</th><th>Item Description</th><th>Quantity</th></tr></thead>
        <tbody><tr><td>1</td><td><div class="po-description" id="po-description"></div><div class="po-note" id="po-note"></div></td><td>As quoted</td></tr></tbody>
      </table>
    </article>
  </main>
  <script type="module">
    import { getEmails } from './assets/js/core/storage.js'
    const id = new URLSearchParams(location.search).get('id')
    const email = getEmails().find(item => item.id === id)
    if (email) {
      const refs = Array.isArray(email.purchaseOrderQuoteRefs) ? email.purchaseOrderQuoteRefs : []
      document.getElementById('po-company').textContent = email.from || 'Customer'
      document.getElementById('po-number').textContent = email.attachments?.[0]?.name?.replace(/\.pdf$/i,'') || 'PO'
      document.getElementById('po-subject').textContent = email.subject || ''
      document.getElementById('po-date').textContent = email.receivedDate || ''
      document.getElementById('po-description').textContent = 'Please supply and complete the works described in the referenced quotation(s).'
      document.getElementById('po-note').textContent = refs.length ? `Note to Supplier:\nQuote Ref: ${refs.join(' / ')}` : 'Note to Supplier:'
    }
  </script>
</body>
</html>

# MaxGreen Agent - nginx static host + FastAPI reverse proxy
#
# TLS: Let's Encrypt cert for 54-179-55-232.sslip.io, renewed automatically by certbot.timer.
# Auth: HTTP Basic against /etc/nginx/auth/maxgreen.htpasswd (mode 640 root:www-data).

# ---------- :80 catch-all ----------
# Anything arriving on the raw IP (or an unknown Host header) is dropped.
# The named vhost below is the only supported way in.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

# ---------- :80 named host ----------
# Port 80 exists only to serve the ACME challenge (so certs can renew)
# and to redirect everyone to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 54-179-55-232.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://54-179-55-232.sslip.io$request_uri;
    }
}

# ---------- :443 the real app ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 54-179-55-232.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/54-179-55-232.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54-179-55-232.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/ubuntu/MaxGreen_Agent/frontend;
    index index.html;
    autoindex off;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/maxgreen.access.log;
    error_log  /var/log/nginx/maxgreen.error.log;

    # Login required for every page and every /api/ call.
    auth_basic "MaxGreen Agent";
    auth_basic_user_file /etc/nginx/auth/maxgreen.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Frontend prototype lives under /frontend/ (all asset paths are relative).
    location = /frontend/ {
        return 302 /frontend/index.html;
    }

    location /frontend/ {
        rewrite ^/frontend/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 302 /frontend/index.html;
    }

    # Nothing outside /frontend/ and /api/ is public (keeps backend source + secrets private).
    location / {
        return 404;
    }
}
